version: 1
mode: dependency-driven
tier: deep
max_parallel: 4
timeout_per_task: 600

# [A-17] Step 0 completes before any step 1 task. Edits to cmd/autarch/main.go are
# serialized: 0.4 -> 0.5 -> 0.6 -> 1.7. Edits to internal/serve/serve.go and
# cmd/autarch/serve.go are serialized: 0.2 -> 0.3 -> 0.4 -> 1.6.
# internal/decisions/service.go: 1.4 -> 1.5 -> 1.6.

stages:
  - name: "Wave 1 — step 0 handlers"
    tasks:
      - id: task-1
        title: "0.1 expose bigend, gurgeh, signals as handlers"
        files: [internal/bigend/daemon/server.go, internal/gurgeh/server/server.go, pkg/signals/server.go]
        depends: []
  - name: "Wave 2 — step 0 mux"
    tasks:
      - id: task-2
        title: "0.2 internal/serve mux, token, origin, project resolution"
        files: [internal/serve/serve.go, internal/serve/auth.go, internal/serve/gurgeh.go, internal/serve/projects.go]
        depends: [task-1]
  - name: "Wave 3 — step 0 shared broker"
    tasks:
      - id: task-3
        title: "0.3 one signals broker shared with gurgeh"
        files: [internal/gurgeh/server/server.go, internal/serve/serve.go]
        depends: [task-2]
  - name: "Wave 4 — step 0 command"
    tasks:
      - id: task-4
        title: "0.4 autarch serve command"
        files: [cmd/autarch/serve.go, cmd/autarch/main.go]
        depends: [task-3]
  - name: "Wave 5 — step 0 MCP"
    tasks:
      - id: task-5
        title: "0.5 autarch mcp subcommand + alias"
        files: [cmd/autarch/mcp.go, cmd/autarch/main.go, cmd/autarch-mcp/main.go, autarch-plugin/.claude-plugin/plugin.json]
        depends: [task-4]
  - name: "Wave 6 — step 0 deprecations"
    tasks:
      - id: task-6
        title: "0.6 deprecation notices, ./dev serve, AGENTS.md"
        files: [cmd/bigend/main.go, cmd/autarch/main.go, internal/gurgeh/cli/commands/serve.go, dev, AGENTS.md]
        depends: [task-5]
  - name: "Wave 7 — model"
    tasks:
      - id: task-7
        title: "1.1 model, validation, revision, bead id"
        files: [internal/decisions/model.go]
        depends: [task-6]
  - name: "Wave 8 — tracker and ruling files"
    tasks:
      - id: task-8
        title: "1.2 bd tracker (explicit ids, outcome-unknown)"
        files: [internal/decisions/tracker.go]
        depends: [task-7]
      - id: task-9
        title: "1.3 ruling files (os.Root) and owner lock"
        files: [internal/decisions/ruling.go, internal/decisions/lock.go]
        depends: [task-7]
  - name: "Wave 9 — service"
    tasks:
      - id: task-10
        title: "1.4 service: file, pick, reconcile, ack"
        files: [internal/decisions/service.go]
        depends: [task-8, task-9]
  - name: "Wave 10 — feed"
    tasks:
      - id: task-11
        title: "1.5 feed, recent, undeliverable, stats"
        files: [internal/decisions/service.go]
        depends: [task-10]
  - name: "Wave 11 — API"
    tasks:
      - id: task-12
        title: "1.6 HTTP API, client, single owner, startup order"
        files: [internal/decisions/api.go, internal/decisions/client.go, internal/serve/serve.go, cmd/autarch/serve.go]
        depends: [task-11]
  - name: "Wave 12 — clients"
    tasks:
      - id: task-13
        title: "1.7 decide CLI, exit codes, MCP tool"
        files: [cmd/autarch/decide.go, cmd/autarch/exit.go, cmd/autarch/main.go, pkg/mcp/server.go]
        depends: [task-12]
      - id: task-14
        title: "1.8 Mycroft escalations as ruling-only decisions"
        files: [internal/mycroft/escalate/escalate.go, internal/mycroft/scheduler/orchestrator.go, cmd/mycroft/main.go, internal/tui/views/mycroft.go]
        depends: [task-12]
      - id: task-15
        title: "1.9 bb plugin: rail, wakes, feed, bb home ask"
        files: [integrations/bb-plugin-autarch/]
        depends: [task-12]
  - name: "Wave 13 — harness"
    tasks:
      - id: task-16
        title: "1.10 homee2e scenario harness (fake mode)"
        files: [internal/homee2e/]
        depends: [task-13, task-14, task-15]
  - name: "Wave 14 — hub check"
    tasks:
      - id: task-17
        title: "1.11 hub e2e on zklw and follow-up beads"
        files: [docs/research/2026-09-26-home-e2e-hub.jsonl, docs/research/2026-09-26-home-e2e-check.md]
        depends: [task-16]
