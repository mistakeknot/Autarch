version: 1
mode: dependency-driven
tier: deep
max_parallel: 4
timeout_per_task: 600

# [A-17] Step 0 completes before any step 1 task. Edits to cmd/autarch/main.go are
# serialized: 0.4 -> 0.5 -> 0.6 -> 1.8. Edits to cmd/autarch/serve.go and
# internal/serve/serve.go are serialized: 0.2 -> 0.3 -> 0.4 -> 1.7.

stages:
  - name: "Wave 1 — step 0 handlers"
    tasks:
      - id: task-1
        title: "0.1 expose bigend, gurgeh, signals as handlers"
        files: [internal/bigend/daemon/server.go, internal/gurgeh/server/server.go, pkg/signals/server.go]
        depends: []
  - name: "Wave 2 — step 0 mux"
    tasks:
      - id: task-2
        title: "0.2 internal/serve mux, token, origin, project resolution"
        files: [internal/serve/serve.go, internal/serve/auth.go, internal/serve/gurgeh.go, internal/serve/projects.go]
        depends: [task-1]
  - name: "Wave 3 — step 0 shared broker"
    tasks:
      - id: task-3
        title: "0.3 one signals broker shared with gurgeh"
        files: [internal/gurgeh/server/server.go, internal/serve/serve.go]
        depends: [task-2]
  - name: "Wave 4 — step 0 command"
    tasks:
      - id: task-4
        title: "0.4 autarch serve command"
        files: [cmd/autarch/serve.go, cmd/autarch/main.go]
        depends: [task-3]
  - name: "Wave 5 — step 0 MCP"
    tasks:
      - id: task-5
        title: "0.5 autarch mcp subcommand + alias"
        files: [cmd/autarch/mcp.go, cmd/autarch/main.go, cmd/autarch-mcp/main.go, autarch-plugin/.claude-plugin/plugin.json]
        depends: [task-4]
  - name: "Wave 6 — step 0 deprecations"
    tasks:
      - id: task-6
        title: "0.6 deprecation notices, ./dev serve, AGENTS.md"
        files: [cmd/bigend/main.go, cmd/autarch/main.go, internal/gurgeh/cli/commands/serve.go, internal/signals/cli/serve.go, dev, AGENTS.md]
        depends: [task-5]
  - name: "Wave 7 — step 1 model"
    tasks:
      - id: task-7
        title: "1.1 model, validation, revision, hash freeze"
        files: [internal/decisions/model.go, internal/decisions/freeze.go]
        depends: [task-6]
  - name: "Wave 8 — step 1 foundations"
    tasks:
      - id: task-8
        title: "1.2 bd tracker with op labels and outcome-unknown"
        files: [internal/decisions/tracker.go]
        depends: [task-7]
      - id: task-9
        title: "1.3 signed ruling files"
        files: [internal/decisions/ruling.go, internal/decisions/sign.go]
        depends: [task-7]
      - id: task-10
        title: "1.4 attempts, owner lock, continuation runner"
        files: [internal/decisions/attempt.go, internal/decisions/run.go, internal/decisions/lock.go]
        depends: [task-7]
  - name: "Wave 9 — step 1 service"
    tasks:
      - id: task-11
        title: "1.5 service: file, pick once, revert, recover"
        files: [internal/decisions/service.go]
        depends: [task-8, task-9, task-10]
  - name: "Wave 10 — step 1 feed and mycroft"
    tasks:
      - id: task-12
        title: "1.6 feed, wakes, recent, stats"
        files: [internal/decisions/service.go]
        depends: [task-11]
      - id: task-15
        title: "1.9 mycroft files decision beads; mycroft dispatch"
        files: [internal/mycroft/escalate/escalate.go, internal/mycroft/scheduler/orchestrator.go, cmd/mycroft/main.go, internal/tui/views/mycroft.go]
        depends: [task-11]
  - name: "Wave 11 — step 1 API"
    tasks:
      - id: task-13
        title: "1.7 decisions HTTP API and single owner on serve"
        files: [internal/decisions/api.go, internal/serve/serve.go, cmd/autarch/serve.go]
        depends: [task-12]
  - name: "Wave 12 — step 1 surfaces"
    tasks:
      - id: task-14
        title: "1.8 decide CLI and MCP tool"
        files: [cmd/autarch/decide.go, cmd/autarch/main.go, pkg/mcp/server.go]
        depends: [task-13]
      - id: task-16
        title: "1.10 bb plugin: rail, wakes, feed, bb home ask"
        files: [integrations/bb-plugin-autarch/]
        depends: [task-13]
  - name: "Wave 13 — harness"
    tasks:
      - id: task-17
        title: "1.11 homee2e scenario harness"
        files: [internal/homee2e/]
        depends: [task-14, task-15, task-16]
  - name: "Wave 14 — real hub"
    tasks:
      - id: task-18
        title: "1.12 e2e check on zklw against the real hub tracker"
        files: [docs/research/2026-09-26-home-e2e-check.md]
        depends: [task-17]
