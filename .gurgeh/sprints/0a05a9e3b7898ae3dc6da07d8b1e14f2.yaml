    project_name: Autarch
    risks:
        evidence:
            - quote: State() method returned raw pointer to internal state, allowing concurrent unsynchronized access
              source: docs/solutions/runtime-errors/arbiter-state-pointer-escape-20260201.md:8
            - quote: Map read/write races between TUI rendering and state mutation goroutines
              source: docs/solutions/runtime-errors/arbiter-state-pointer-escape-20260201.md:7
            - quote: Clone returns a deep copy of the SprintState. ScanArtifacts is shared (immutable after creation) and not deep-copied.
              source: internal/gurgeh/arbiter/types.go:314
            - quote: NEVER use `killall`, `pkill node`, `pkill pnpm`, `pkill cargo`, or similar broad kill commands. The user runs multiple parallel AI agents that must never be interrupted.
              source: docs/coldwine/AGENTS.md:221
            - quote: Set `GITHUB_TOKEN` for higher rate limits on GitHub searches
              source: docs/WORKFLOWS.md:149
            - quote: 'Common failure mode: Tool execution succeeds but results don''t propagate to UI. The pipeline completes without error, but the view shows default values ("Unknown Project").'
              source: AGENTS.md:266-267
        summary: Concurrency race conditions from pointer escapes in TUI-to-orchestrator communication (mitigated via deep-copy patterns), fragmented context when Intermute is unavailable, external API rate limits for research hunters, and complexity of maintaining consistent state across four tools with multiple data flow paths.
