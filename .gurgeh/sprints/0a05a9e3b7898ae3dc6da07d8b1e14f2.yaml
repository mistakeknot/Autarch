sections:
    0:
        preamble: ""
        content: |-
            ## Vision

            A system for producing excellent, research-informed PRDs that remain the canonical source of truth throughout development. Pollard provides strategic research and competitive intelligence. Gurgeh transforms that research into detailed, high-quality specifications with versioned history and structured revision tracking. Coldwine and Bigend ensure specs stay synchronized with execution, preventing drift between what was specified and what gets built.
        options: []
        status: 2
        autoaccept: false
        activesignals: []
        useredits: []
        updatedat: 2026-02-04T21:02:03.035322306-08:00
    1:
        preamble: ""
        content: 'Modern AI-assisted development is fragmented: research evaporates in chat windows, specifications drift from reality, task breakdowns are manual and disconnected from specs, agents work without broader context, and observation requires manually checking multiple sources. Each gap loses context, forgets decisions, and duplicates work.'
        options: []
        status: 2
        autoaccept: false
        activesignals: []
        useredits: []
        updatedat: 2026-02-04T21:32:22.981260946-08:00
    2:
        preamble: ""
        content: Solo developers who leverage AI coding assistants (Claude, Codex, Cursor, Aider) to build products faster—turning ideas into working software through natural language collaboration rather than traditional line-by-line coding.
        options: []
        status: 2
        autoaccept: false
        activesignals: []
        useredits: []
        updatedat: 2026-02-04T21:37:48.137837621-08:00
    3:
        preamble: ""
        content: 'Four integrated tools: Pollard (multi-domain research hunters for GitHub, arXiv, HackerNews, PubMed, OpenAlex, etc. that enrich all Arbiter sprint phases), Gurgeh (TUI-first PRD generation with 8-phase Arbiter sprints where each phase can trigger targeted research, plus consistency checking and confidence scoring), Coldwine (task orchestration with Intermute-based file reservations for parallel agent development), and Bigend (mission control dashboard for observing all agents/projects across web and TUI modes).'
        options: []
        status: 1
        autoaccept: false
        activesignals: []
        useredits: []
        updatedat: 2026-02-04T22:51:07.947860424-08:00
    4:
        preamble: ""
        content: "**CUJ-1: Research-Enriched PRD Creation** — A solo developer with a product idea opens the unified TUI (`./dev autarch tui`), triggering Gurgeh's Kickoff phase which scans the codebase for existing structure, tech stack, and dependencies. The Arbiter Sprint then guides them through 8 phases, with Pollard research enriching each: Vision triggers market trend hunters (GitHub Scout, HackerNews), Problem triggers academic research (arXiv, OpenAlex) to validate uniqueness, Users triggers community analysis to validate personas, Features triggers competitor tracking for parity analysis, CUJs triggers workflow pattern extraction from similar products, Requirements triggers implementation pattern search, Scope triggers inverse research (\"what did competitors NOT build in v1?\"), and Acceptance triggers test pattern discovery. As hunters return findings, the doc pane's \"Research Findings\" section updates with relevance-ranked insights (⚔\U0001F4CA\U0001F464 icons), the sidebar badge increments for high-relevance items, and the log pane streams hunter activity. The user can select any finding to expand details inline, or ask the chat pane \"how does this affect our vision?\" to get contextual synthesis. The consistency engine flags conflicts while a running confidence score (0-100%) shows PRD strength. Success: validated PRD saved to `.gurgeh/specs/` in under 25 minutes with confidence >70%, research coverage >80%, and no unresolved blockers.\n\n**CUJ-2: PRD to Task Breakdown** — With a completed PRD, the developer initializes Coldwine which reads the spec and proposes an Initiative → Epic → Story → Task hierarchy derived from PRD features. The user accepts or edits proposals through the TUI, then starts their first task. Before beginning work, Coldwine registers the task with Intermute and acquires file reservations for paths the task will modify (using glob patterns like `internal/auth/**/*.go`). Each reservation has a TTL and prevents other agents from claiming overlapping paths. Success: dependency DAG computed, tasks ready for agent assignment within 5-10 minutes.\n\n**CUJ-3: Continuous Research Validation** — As the developer iterates on their PRD, Pollard monitors for research invalidation signals. When new findings contradict PRD assumptions (e.g., a competitor ships a feature assumed to be unique), Pollard emits a `SignalResearchInvalidation` that surfaces as a sidebar attention indicator (● with warning color) rather than a disruptive modal. The doc pane's Research Findings section highlights the invalidating insight at the top with an explanation of which assumption it affects. The developer can trigger deep research at any phase—Pollard auto-selects relevant hunters based on phase content and synthesizes insights with relevance scores (0.0-1.0) linked to specific spec sections. The chat pane provides context: \"New competitor finding may affect your 'unique differentiator' claim—want me to analyze alternatives?\" After reviewing findings and updating assumptions, re-running consistency checks shows improved confidence. Success: insights linked to spec sections, assumption confidence increased, PRD quality >80%.\n\n**CUJ-4: Parallel Agent Development** — A developer managing multiple features assigns tasks to different AI coding agents. When an agent claims a task, Coldwine registers the session with Intermute and acquires file reservations for the task's target paths. If another agent attempts to claim overlapping files, Intermute rejects the reservation—the developer sees a \"blocked\" status and can either wait for the first agent to finish or reassign tasks to non-overlapping work. Agents coordinate via Intermute's inbox messaging for handoffs (e.g., \"auth module ready for integration\"). Reservation TTLs auto-expire on agent completion or stall detection. Success: no concurrent edits to same files, clear blocking visibility, reservation cleanup after completion.\n\n**CUJ-5: Multi-Project Mission Control** — A developer running 3+ Autarch-enabled projects opens Bigend (web at `:8099` or TUI). Bigend discovers all projects by scanning for `.gurgeh/`, `.coldwine/`, `.pollard/` directories, aggregates metrics (spec completion %, task progress, agent activity, research coverage), and streams real-time updates via WebSocket. Drilling into a project shows active PRD phases, task breakdowns, research coverage per phase, and agent session states (working/waiting/blocked/stalled/done/error). Success: unified view with <2s update latency, accurate state detection >90%."
