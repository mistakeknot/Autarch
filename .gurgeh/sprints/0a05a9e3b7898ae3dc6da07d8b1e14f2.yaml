    5:
        preamble: ""
        content: "**Data & Persistence** — All tools maintain local-first storage in dedicated directories (`.gurgeh/`, `.coldwine/`, `.pollard/`) using YAML for human-readable artifacts and SQLite with WAL mode for high-frequency operations. Specs, sprints, and research findings persist as versioned YAML enabling git-based history. Signal deduplication uses a `(spec_id, type, affected_field)` unique constraint to prevent alert fatigue. Task state transitions (todo → in_progress → blocked → done) and agent sessions are tracked in normalized SQLite tables with foreign key relationships linking tasks to epics, stories, and sessions.\n\n**Integration & Coordination** — Intermute (`../Intermute`) serves as the central coordination bus, exposing first-class entities (Spec, CriticalUserJourney, Epic, Story, Task, Insight, Session) via REST with a standardized `{ok, data, meta, error}` envelope. Cross-tool signals (competitor_shipped, research_invalidation, execution_drift, vision_drift) broadcast at info/warning/critical severity levels. Agent coordination uses inbox-based messaging with thread grouping, importance levels, and acknowledgment flags for critical handoffs.\n\n**Research Enrichment** — Each Arbiter phase triggers phase-appropriate hunters: Vision activates GitHub Scout and HackerNews for market trends, Problem activates arXiv and OpenAlex for academic validation, Features activates competitor tracking for parity analysis. Pipeline modes (quick/balanced/deep) control synthesis depth with configurable parallelism and 2-minute per-item timeouts. Relevance scoring uses weighted factors (engagement, citations, recency, query match) with domain-specific half-lives—7 days for trends, 90 days for repos, 365 days for academic research. Insights link bidirectionally to spec sections via `linked_features` and `initiative_ref` fields.\n\n**Research Suggestion UX** — Pollard findings surface through all four TUI panes using existing component patterns: (1) **Doc pane** displays a collapsible \"Research Findings\" section within the current phase view, showing relevance-ranked insights with icons (⚔ competitive, \U0001F4CA trends, \U0001F464 user) and brief summaries—selecting a finding expands inline detail; (2) **Sidebar** shows research status via dynamic icons (● running, ◐ partial results, ✓ complete) with a badge count of high-relevance findings requiring attention; (3) **Chat pane** receives research context as system messages when findings arrive, enabling the user to ask follow-up questions like \"tell me more about competitor X\" or \"how does this affect our approach?\"; (4) **Log pane** streams hunter activity (\"GitHub Scout: found 3 trending repos\", \"arXiv: 2 relevant papers\") for transparency without interrupting the main workflow. High-relevance findings (score >0.8) trigger a subtle attention indicator in the sidebar rather than modal interruptions.\n\n**Isolation & Performance** — Intermute file reservations provide task isolation: agents acquire reservations on glob patterns (e.g., `internal/auth/**/*.go`) with configurable TTLs before modifying files. Overlapping reservations are rejected, surfacing as \"blocked\" status in the TUI. Reservations auto-release on task completion, agent disconnect, or TTL expiry. Session state (working/waiting/blocked/done) tracks via `last_active_at` timestamps with automatic stall detection. TUI refresh targets 2-second intervals, git commit scanning runs every 60 seconds, and Pollard watch cycles default to 24 hours with per-hunter overrides (2-6 hours for fast sources). All servers bind to loopback by default; remote access requires explicit opt-in with authentication."
